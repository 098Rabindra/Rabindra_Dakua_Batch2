server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: password-vault-backend

  profiles:
    active: postgres # Default profile: postgres (with fallback to dev/h2 if needed)

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:drajapreinsta@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:dzvxyjvoaumymibj}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
            protocols: TLSv1.2
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000


  # H2 Fallback Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/password_vault}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:tiger}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # H2 console (disabled - using PostgreSQL)
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: 9a2f8c4e6b1d3a5f7e8d0c2b4a6f8e1d3c5b7a9f0e2d4c6b8a0f2e4d6c8b0a2f
    expiration-ms: 86400000 # 24 hours
